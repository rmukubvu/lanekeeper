<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- motorway receding toward the horizon -->
  <path d="M40 38 L60 38 L82 100 L18 100 Z" fill="#6e7781"/>
  <path d="M40 38 L18 100" stroke="#f6f8fa" stroke-width="3" fill="none"/>
  <path d="M60 38 L82 100" stroke="#f6f8fa" stroke-width="3" fill="none"/>
  <path d="M50 42 L50 100" stroke="#f6f8fa" stroke-width="3" stroke-dasharray="8 7" fill="none"/>
  <!-- gantry posts -->
  <rect x="6" y="8" width="5" height="38" fill="#57606a"/>
  <rect x="89" y="8" width="5" height="38" fill="#57606a"/>
  <!-- overhead sign -->
  <rect x="3" y="3" width="94" height="32" rx="7" fill="#1a7f37" stroke="#ffffff" stroke-width="3"/>
  <text x="50" y="25.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">PRETORIA</text>
</svg>
