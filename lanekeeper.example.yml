# Lanekeeper policy. Copy to `lanekeeper.yml` in the target repository's default
# branch (preferred — policy lives with the code), or keep a local copy next to
# the service as a fallback. Every field is optional; defaults shown here.
version: 1

# Lanes are decided in order: protected paths always force `deep`, then risk
# thresholds pick the widest lane the change qualifies for.
lanes:
  auto: # eligible for hands-off handling (label + optional auto-merge)
    max_risk: 20
    categories: [docs, dependencies, tests] # every category of the PR must be in this list
  fast: # a human should look, but briefly
    max_risk: 45
  # everything else lands in `deep`

# Globs that always require deep human review, regardless of scores.
protected_paths:
  - ".github/workflows/**"
  - "infra/**"

# Post a guided layered walkthrough on PRs at or above this many changed lines.
explainer:
  min_changed_lines: 300

labels:
  prefix: lanekeeper # labels look like lanekeeper/lane:deep, lanekeeper/risk:high

# Glob -> reviewers to request when matching files change. The PR author is
# excluded automatically.
reviewers: {}
#  "src/api/**": [alice, bob]

# Inline review comments with one-click GitHub suggestion blocks, anchored to
# the exact diff lines behind the risk factors. Proposals that fail anchor
# validation are dropped, never posted.
inline_suggestions:
  enabled: true
  max_comments: 6

# Team & organization review standards, injected into triage, inline review,
# and Sentinel prompts — only the blocks whose path globs match the change.
# Layers (highest priority under the budget first): this repo's
# .lanekeeper/guidelines/*.md, then the org baseline repo, then built-in packs
# (effective-java, effective-go, react-hooks, owasp-top10). Comments driven by
# a guideline cite its id, e.g. [repo:error-handling].
guidelines:
  enabled: true
  packs: [] # e.g. [effective-go, react-hooks, owasp-top10]
  org_repo: "" # e.g. "my-org/.lanekeeper" (reads its guidelines/ directory)
  max_chars: 6000 # injection budget per agent per run

# Sentinel: post-merge security scan of the default branch. Server mode scans
# every push's exact commit range; the CLI scans a time window. Findings must
# cite verbatim evidence (verified mechanically) and become deduplicated
# GitHub issues labeled lanekeeper/sentinel.
sentinel:
  enabled: true
  window_hours: 24 # CLI default lookback
  max_files: 30
  min_severity: medium # don't open issues below this
  paths: [] # optional focus globs; empty = all changed files

# Auto-merge is OFF by default. When enabled, PRs that land in the `auto` lane
# with green CI get a recommendation comment; enabling actual merges is a
# deliberate second step in code (see pipeline.ts).
automerge:
  enabled: false

# Which chat adapters to notify per lane (teams | slack | discord).
notifications:
  deep: [teams]
  fast: [teams]
  auto: []
  sentinel: [teams]
